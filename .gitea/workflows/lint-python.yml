name: Lint (Python)

on:
  pull_request:

jobs:
  lint:
    runs-on: alpine
    container: node:20-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          apk add --no-cache \
            git \
            python3 \
            py3-pip

      - name: Ruff
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --no-cache-dir ruff
          if ! ruff check .; then
            echo "::warning::ruff reported issues"
          fi
