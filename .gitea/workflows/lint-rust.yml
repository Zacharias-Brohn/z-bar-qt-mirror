name: Lint (Rust)

on:
  pull_request:

jobs:
  lint:
    runs-on: alpine
    container: node:20-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          apk add --no-cache \
            git \
            rust

      - name: Rustfmt
        run: |
          if [ -f Cargo.toml ]; then
            cargo fmt --check
          else
            echo "No Rust project found"
          fi
